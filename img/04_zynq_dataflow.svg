<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Simplified Zynq radar FPGA and dataflow architecture</title>
  <desc id="desc">A simplified block diagram showing the host computer, Zynq processing system, programmable logic transmit and receive paths, OpenSDR AD9363 transceiver, RF front end, antenna, capture control, frame metadata and antenna angle input.</desc>

  <defs>
    <marker id="arrowTx" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#d97706"/>
    </marker>
    <marker id="arrowRx" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowCtrl" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 17px Arial, sans-serif; fill: #475569; }
      .group-title { font: 700 27px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 17px Arial, sans-serif; fill: #334155; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
      .lane-tx { font: 700 18px Arial, sans-serif; fill: #92400e; letter-spacing: 1.2px; }
      .lane-rx { font: 700 18px Arial, sans-serif; fill: #1e3a8a; letter-spacing: 1.2px; }
      .lane-ctrl { font: 700 18px Arial, sans-serif; fill: #475569; letter-spacing: 1.2px; }
      .group { stroke-width: 2.5; rx: 24; ry: 24; }
      .node { stroke: #94a3b8; stroke-width: 2; rx: 14; ry: 14; }
      .tx { fill: none; stroke: #d97706; stroke-width: 5; marker-end: url(#arrowTx); }
      .rx { fill: none; stroke: #2563eb; stroke-width: 5; marker-end: url(#arrowRx); }
      .ctrl { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrowCtrl); }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="45" y="48" class="title">Simplified Zynq Radar Dataflow</text>
  <text x="45" y="78" class="subtitle">Functional data and control paths only; clocks, resets, AXI interconnects and debug IP are omitted.</text>

  <!-- Groups -->
  <rect x="35" y="205" width="190" height="190" fill="#f8fafc" stroke="#64748b" class="group"/>
  <rect x="285" y="145" width="300" height="500" fill="#eff6ff" stroke="#3b82f6" class="group"/>
  <rect x="635" y="105" width="610" height="610" fill="#fffbeb" stroke="#d97706" class="group"/>
  <rect x="1305" y="145" width="250" height="455" fill="#f0fdf4" stroke="#16a34a" class="group"/>
  <rect x="1305" y="635" width="250" height="100" fill="#f8fafc" stroke="#64748b" class="group"/>

  <!-- Paths drawn before nodes -->
  <!-- Host command and receive data -->
  <path d="M225 250 H325" class="ctrl"/>
  <path d="M325 290 H225" class="rx"/>

  <!-- PS internal receive transport -->
  <path d="M545 548 H565 V290 H545" class="rx"/>

  <!-- TX data -->
  <path d="M830 267 H870" class="tx"/>
  <path d="M1015 267 H1055" class="tx"/>
  <path d="M1205 267 H1345" class="tx"/>
  <path d="M1430 345 V390" class="tx"/>
  <path d="M1430 490 V520" class="tx"/>

  <!-- RX data -->
  <path d="M1345 440 H1265 V465 H1205" class="rx"/>
  <path d="M1055 465 H1025" class="rx"/>
  <path d="M860 465 H830" class="rx"/>
  <path d="M752 520 V555" class="rx"/>
  <path d="M675 605 H615 V548 H545" class="rx"/>

  <!-- PS to PL controls -->
  <path d="M545 385 H615 V267 H675" class="ctrl"/>
  <path d="M545 415 H600 V635 H870" class="ctrl"/>

  <!-- DMA interrupt -->
  <path d="M675 625 H610 V445 H545" class="ctrl"/>

  <!-- Capture control to TX/RX -->
  <path d="M952 595 V340 H942 V320" class="ctrl"/>
  <path d="M952 595 V545 H942 V520" class="ctrl"/>

  <!-- Metadata -->
  <path d="M1130 595 V545 H985 V520" class="ctrl"/>
  <path d="M1305 670 H1225 V635 H1205" class="ctrl"/>

  <!-- Motor command -->
  <path d="M545 440 H600 V710 H1305" class="ctrl"/>

  <!-- Host -->
  <text x="130" y="245" text-anchor="middle" class="group-title">Host PC</text>
  <text x="130" y="282" text-anchor="middle" class="box-title">Python software</text>
  <text x="130" y="316" text-anchor="middle" class="box-text">Acquisition / storage</text>
  <text x="130" y="345" text-anchor="middle" class="box-text">A-scope / B-scope</text>
  <text x="130" y="374" text-anchor="middle" class="box-text">Processing / validation</text>

  <!-- PS -->
  <text x="435" y="187" text-anchor="middle" class="group-title">Zynq PS</text>

  <rect x="325" y="225" width="220" height="90" fill="#ffffff" class="node"/>
  <text x="435" y="260" text-anchor="middle" class="box-title">USB bulk</text>
  <text x="435" y="290" text-anchor="middle" class="box-text">Host command and data link</text>

  <rect x="325" y="350" width="220" height="105" fill="#ffffff" class="node"/>
  <text x="435" y="385" text-anchor="middle" class="box-title">PS firmware</text>
  <text x="435" y="415" text-anchor="middle" class="box-text">DMA / capture configuration</text>
  <text x="435" y="443" text-anchor="middle" class="box-text">RF and motor control</text>

  <rect x="325" y="500" width="220" height="95" fill="#ffffff" class="node"/>
  <text x="435" y="536" text-anchor="middle" class="box-title">DDR memory</text>
  <text x="435" y="567" text-anchor="middle" class="box-text">Completed I/Q frames</text>

  <!-- PL -->
  <text x="940" y="147" text-anchor="middle" class="group-title">Zynq Programmable Logic</text>

  <text x="675" y="190" class="lane-tx">TX PATH</text>
  <rect x="675" y="215" width="155" height="105" fill="#ffffff" class="node"/>
  <text x="752" y="250" text-anchor="middle" class="box-title">Waveform BRAM</text>
  <text x="752" y="281" text-anchor="middle" class="box-text">Dual-port payload</text>
  <text x="752" y="307" text-anchor="middle" class="small">Loaded from the PS</text>

  <rect x="870" y="215" width="145" height="105" fill="#ffffff" class="node"/>
  <text x="942" y="250" text-anchor="middle" class="box-title">TX player</text>
  <text x="942" y="281" text-anchor="middle" class="box-text">I/Q playback</text>
  <text x="942" y="307" text-anchor="middle" class="small">Single or repeated</text>

  <rect x="1055" y="215" width="150" height="105" fill="#ffffff" class="node"/>
  <text x="1130" y="250" text-anchor="middle" class="box-title">DDR TX output</text>
  <text x="1130" y="281" text-anchor="middle" class="box-text">AD9363 interface</text>
  <text x="1130" y="307" text-anchor="middle" class="small">12-bit I/Q timing</text>

  <text x="675" y="385" class="lane-rx">RX PATH</text>
  <rect x="1055" y="410" width="150" height="110" fill="#ffffff" class="node"/>
  <text x="1130" y="445" text-anchor="middle" class="box-title">DDR RX input</text>
  <text x="1130" y="476" text-anchor="middle" class="box-text">12-bit I/Q capture</text>
  <text x="1130" y="504" text-anchor="middle" class="small">61.44 MHz clock</text>

  <rect x="860" y="410" width="165" height="110" fill="#ffffff" class="node"/>
  <text x="942" y="443" text-anchor="middle" class="box-title">I/Q + metadata</text>
  <text x="942" y="474" text-anchor="middle" class="box-text">32-bit AXI Stream</text>
  <text x="942" y="502" text-anchor="middle" class="small">Frame ID and azimuth</text>

  <rect x="675" y="410" width="155" height="110" fill="#ffffff" class="node"/>
  <text x="752" y="443" text-anchor="middle" class="box-title">Async AXIS FIFO</text>
  <text x="752" y="474" text-anchor="middle" class="box-text">Clock crossing</text>
  <text x="752" y="502" text-anchor="middle" class="small">Backpressure isolation</text>

  <rect x="675" y="555" width="155" height="100" fill="#ffffff" class="node"/>
  <text x="752" y="590" text-anchor="middle" class="box-title">AXI DMA S2MM</text>
  <text x="752" y="621" text-anchor="middle" class="box-text">Scatter-gather</text>
  <text x="752" y="647" text-anchor="middle" class="small">Stream to PS DDR</text>

  <text x="870" y="570" class="lane-ctrl">CONTROL / METADATA</text>
  <rect x="870" y="595" width="165" height="80" fill="#ffffff" class="node"/>
  <text x="952" y="628" text-anchor="middle" class="box-title">Capture controller</text>
  <text x="952" y="657" text-anchor="middle" class="small">Frame timing / streaming</text>

  <rect x="1055" y="595" width="150" height="80" fill="#ffffff" class="node"/>
  <text x="1130" y="628" text-anchor="middle" class="box-title">Frame + angle</text>
  <text x="1130" y="657" text-anchor="middle" class="small">ID tracking / UART input</text>

  <!-- RF -->
  <text x="1430" y="187" text-anchor="middle" class="group-title">OpenSDR / RF</text>

  <rect x="1345" y="225" width="170" height="120" fill="#ffffff" class="node"/>
  <text x="1430" y="263" text-anchor="middle" class="box-title">AD9363</text>
  <text x="1430" y="295" text-anchor="middle" class="box-text">TX / RX FIR</text>
  <text x="1430" y="323" text-anchor="middle" class="small">Digital and RF transceiver</text>

  <rect x="1345" y="390" width="170" height="100" fill="#ffffff" class="node"/>
  <text x="1430" y="425" text-anchor="middle" class="box-title">RF front end</text>
  <text x="1430" y="456" text-anchor="middle" class="box-text">Circulator / amplifiers</text>

  <rect x="1345" y="520" width="170" height="55" fill="#ffffff" class="node"/>
  <text x="1430" y="555" text-anchor="middle" class="box-title">Shared antenna</text>

  <text x="1430" y="672" text-anchor="middle" class="box-title">Motor / angle controller</text>
  <text x="1430" y="705" text-anchor="middle" class="box-text">Rotation command and azimuth feedback</text>

  <!-- Small path labels -->

  <!-- Legend -->
  <line x1="45" y1="778" x2="120" y2="778" class="tx"/>
  <text x="142" y="785" class="box-text">TX waveform data</text>
  <line x1="365" y1="778" x2="440" y2="778" class="rx"/>
  <text x="462" y="785" class="box-text">RX I/Q frame data</text>
  <line x1="690" y1="778" x2="765" y2="778" class="ctrl"/>
  <text x="787" y="785" class="box-text">Control, metadata and interrupts</text>
</svg>
